<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워크샵 팀 나누기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-image: url('https://cdn.imweb.me/thumbnail/20210312/6d24add144ce4.jpg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Malgun Gothic', Arial, sans-serif;
            text-align: center;
            color: #333;
        }

        /* 탭 네비게이션 */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 16px;
            background: rgba(0,0,0,0.5);
        }
        .tab-btn {
            padding: 10px 30px;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255,255,255,0.4);
            color: #fff;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.95);
            color: #333;
        }

        /* 탭 컨텐츠 */
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        /* 설정 탭 */
        .settings-panel {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 24px;
            text-align: left;
        }
        .settings-panel h2 { margin-bottom: 16px; }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-row input, .input-row select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-row input[type="text"] { width: 120px; }
        .input-row select { width: 100px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-add { background: #4a90d9; color: #fff; }
        .btn-save { background: #2ecc71; color: #fff; font-size: 16px; padding: 10px 28px; }
        .btn-danger { background: #d94a4a; color: #fff; }
        .btn-reset { background: #888; color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        /* 멤버 테이블 */
        .member-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            table-layout: fixed;
        }
        .member-table th, .member-table td {
            padding: 6px 8px;
            text-align: center;
            font-size: 14px;
        }
        .member-table th {
            background: #f0f0f0;
            border-bottom: 2px solid #ddd;
            font-size: 13px;
        }
        .member-table td {
            border-bottom: 1px solid #eee;
        }
        .member-table th:nth-child(1), .member-table td:nth-child(1) { width: 40px; }
        .member-table th:nth-child(2), .member-table td:nth-child(2) { width: 100px; }
        .member-table th:nth-child(3), .member-table td:nth-child(3) { width: 80px; }
        .member-table th:nth-child(4), .member-table td:nth-child(4) { width: 60px; }
        .member-table th:nth-child(5), .member-table td:nth-child(5) { width: 60px; }
        .member-table th:nth-child(6), .member-table td:nth-child(6) { width: 60px; }
        .member-table tr:hover { background: #f9f9f9; }

        .member-count {
            margin-top: 12px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
        }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        /* 추첨 탭 */
        .draw-area {
            padding-top: 20px;
        }
        .logo img {
            width: 400px;
            height: auto;
            margin: auto;
        }
        .draw-title {
            color: #eee;
            font-size: 24px;
            margin: 20px 0;
        }
        .draw-btn {
            padding: 18px 60px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            background-size: 200% 200%;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(245, 87, 108, 0.4);
            animation: btnGlow 3s ease infinite;
            letter-spacing: 2px;
        }
        @keyframes btnGlow {
            0%, 100% { background-position: 0% 50%; box-shadow: 0 4px 20px rgba(245, 87, 108, 0.4); }
            50% { background-position: 100% 50%; box-shadow: 0 4px 30px rgba(79, 172, 254, 0.6); }
        }
        .draw-btn:hover { transform: scale(1.1); box-shadow: 0 6px 30px rgba(245, 87, 108, 0.6); }
        .draw-btn:active { transform: scale(0.95); }

        #result {
            margin-top: 30px;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 0 20px;
        }
        .team {
            display: inline-block;
            vertical-align: top;
            margin: 0;
            padding: 16px;
            border: none;
            width: 220px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            backdrop-filter: blur(4px);
            transform: translateY(30px);
            opacity: 0;
            animation: teamSlideIn 0.5s ease forwards;
        }
        @keyframes teamSlideIn {
            to { transform: translateY(0); opacity: 1; }
        }
        .team h3 {
            margin: 0 0 12px 0;
            font-size: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        .team p {
            margin: 6px 0;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.4);
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            font-size: 15px;
        }
        .team p.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* 카운트다운 */
        .countdown {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 40px rgba(255,255,255,0.8), 0 0 80px rgba(245, 87, 108, 0.6);
            animation: countPulse 0.6s ease;
            margin-top: 60px;
        }
        @keyframes countPulse {
            0% { transform: scale(2); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shuffleEffect {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-2deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(15px) rotate(2deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .shuffle {
            margin-top: 60px;
            animation: shuffleEffect 0.4s infinite;
            color: #fff;
            font-size: 44px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        /* 완료 효과 */
        .done-msg {
            margin-top: 20px;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.6);
            animation: doneFade 1s ease;
        }
        @keyframes doneFade {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 팀 설정 영역 */
        .team-settings {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #ddd;
        }
        .team-settings h3 { margin-bottom: 12px; }
        .team-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .team-row input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 140px; }
        .team-row input[type="number"] { width: 60px; text-align: center; }
        .team-row input[type="color"] { width: 40px; height: 32px; padding: 2px; cursor: pointer; }
        .team-row label { font-size: 13px; min-width: 50px; }
        .team-row .limit-label { font-size: 12px; color: #666; min-width: auto; }
    </style>
</head>

<body>
    <!-- 탭 네비게이션 -->
    <div class="tab-bar">
		<button class="tab-btn" onclick="switchTab('draw')">팀 추첨</button>
        <button class="tab-btn active" onclick="switchTab('settings')">멤버 관리</button>
    </div>

    <!-- 설정 탭 -->
    <div id="tab-settings" class="tab-content active">
        <div class="settings-panel">
            <h2>멤버 관리</h2>

            <!-- 멤버 추가 폼 -->
            <div class="input-row">
                <input type="text" id="inputName" placeholder="이름">
                <select id="inputAgeGroup">
                    <option value="20대">20대</option>
                    <option value="30대">30대</option>
                    <option value="40대">40대</option>
                    <option value="50대">50대</option>
                    <option value="60대">60대</option>
                </select>
                <select id="inputGender">
                    <option value="male">남</option>
                    <option value="female">여</option>
                </select>
                <button class="btn btn-add" onclick="addMember()">추가</button>
            </div>

            <!-- 멤버 목록 -->
            <table class="member-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>이름</th>
                        <th>연령대</th>
                        <th>성별</th>
                        <th>그룹</th>
                        <th>삭제</th>
                    </tr>
                </thead>
                <tbody id="memberList"></tbody>
            </table>

            <div class="member-count" id="memberCount"></div>

            <div class="actions-bar">
                <button class="btn btn-save" onclick="saveToSheet()">저장</button>
                <button class="btn btn-add" onclick="loadFromSheet()">불러오기</button>
            </div>
            <div id="saveStatus" style="margin-top:8px;font-size:13px;color:#666;"></div>

            <!-- 팀 설정 -->
            <div class="team-settings">
                <h3>팀 설정</h3>
                <p style="font-size:12px; color:#888; margin-bottom:10px; line-height:1.5;">
                    💡 <b>인원</b>은 <b>최대 제한</b>입니다. 비워두면 무제한.<br>
                    기본은 <b>모든 팀 균등 배분</b> (예: 45명/4팀 = 12,11,11,11 - 어느 팀이 12명일지는 랜덤)<br>
                    특정 팀 인원을 고정하고 싶을 때만 숫자 입력 (예: 5명 팀 하나 만들 때)
                </p>
                <div id="teamSettingsArea"></div>
                <div class="input-row" style="margin-top: 12px;">
                    <button class="btn btn-add btn-sm" onclick="addTeam()">+ 팀 추가</button>
                    <button class="btn btn-danger btn-sm" onclick="removeLastTeam()">- 마지막 팀 삭제</button>
                </div>
            </div>
        </div>
    </div>


    <!-- 추첨 탭 -->
    <div id="tab-draw" class="tab-content">
        <div class="draw-area">
            <div class="logo">
                <img src="Img/GMISSIONLogo2.png" onerror="this.alt='LOGO'; this.style.width='400px'; this.style.height='100px'; this.style.border='2px dashed #fff'; this.style.lineHeight='100px'; this.style.color='#fff'; this.style.fontSize='24px'; this.style.display='inline-block';">
            </div>
            <button class="draw-btn" onclick="startShuffle()">팀 추첨</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        // ============================================
        // 데이터 관리 (localStorage)
        // ============================================
        var STORAGE_KEY_MEMBERS = 'teamDivider_members';
        var STORAGE_KEY_CONFIG = 'teamDivider_config';
        var STORAGE_KEY_FIXED = 'teamDivider_fixedGroups';

        // 현재 편집 중인 데이터 (저장 전까지 메모리에만 존재)
        var currentMembers = [];
        var currentConfig = {};

        function initData() {
            var saved = localStorage.getItem(STORAGE_KEY_MEMBERS);
            if (saved) currentMembers = JSON.parse(saved);

            var savedCfg = localStorage.getItem(STORAGE_KEY_CONFIG);
            if (savedCfg) currentConfig = JSON.parse(savedCfg);

            if (!currentConfig.teamNames) {
                currentConfig = {
                    title: '팀 배정',
                    teamNames: ['A팀', 'B팀', 'C팀', 'D팀'],
                    teamColors: ['#e3c5e8', '#d48181', '#f9c79e', '#cbeff3'],
                    teamLimits: []
                };
            }
            if (!currentConfig.teamLimits) currentConfig.teamLimits = [];
        }

        // ============================================
        // Google Sheets 연동
        // ============================================
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLfmJUY_k7Q5SkeFDJth0vAd_LDwkyKUzBwZHTTjt1rtDX9U18IXFN1nNiIJZB8r4/exec';

        function setStatus(msg) {
            document.getElementById('saveStatus').textContent = msg;
        }

        // JSONP 방식으로 Google Apps Script 호출 (CORS 우회)
        function callSheet(params, callback) {
            var cbName = 'sheetCb_' + Date.now();
            window[cbName] = function(data) {
                delete window[cbName];
                callback(data);
            };
            var script = document.createElement('script');
            script.src = SCRIPT_URL + '?' + params + '&callback=' + cbName;
            script.onerror = function() {
                delete window[cbName];
                setStatus('연결 실패');
            };
            document.body.appendChild(script);
            setTimeout(function() { document.body.removeChild(script); }, 10000);
        }

        function saveToSheet() {
            localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(currentMembers));
            localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(currentConfig));

            setStatus('시트에 저장 중...');

            var teams = currentConfig.teamNames.map(function(name, i) {
                return {
                    name: name,
                    color: currentConfig.teamColors[i] || '#cccccc',
                    limit: currentConfig.teamLimits[i] || ''
                };
            });

            var saveData = encodeURIComponent(JSON.stringify({ members: currentMembers, teams: teams }));
            callSheet('action=save&data=' + saveData, function(data) {
                if (data.success) {
                    setStatus('시트에 저장 완료!');
                } else {
                    setStatus('저장 실패: ' + (data.error || '알 수 없는 오류'));
                }
            });
        }

        function loadFromSheet() {
            setStatus('시트에서 불러오는 중...');

            callSheet('action=read', function(data) {
                if (data.members && data.members.length > 0) {
                    currentMembers = data.members;
                }
                if (data.teams && data.teams.length > 0) {
                    currentConfig.teamNames = data.teams.map(function(t) { return t.name; });
                    currentConfig.teamColors = data.teams.map(function(t) { return t.color; });
                    currentConfig.teamLimits = data.teams.map(function(t) { return t.limit; });
                }

                // 고정조 저장
                if (data.fixedGroups) {
                    localStorage.setItem(STORAGE_KEY_FIXED, JSON.stringify(data.fixedGroups));
                }

                localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(currentMembers));
                localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(currentConfig));

                renderMemberList();
                renderTeamSettings();
                setStatus('멤버 ' + currentMembers.length + '명 / 팀 ' + currentConfig.teamNames.length + '개 불러옴!');
            });
        }

        function loadPrevious() {
            var saved = localStorage.getItem(STORAGE_KEY_MEMBERS);
            if (!saved) { alert('저장된 이전 데이터가 없습니다.'); return; }
            currentMembers = JSON.parse(saved);
            var savedCfg = localStorage.getItem(STORAGE_KEY_CONFIG);
            if (savedCfg) currentConfig = JSON.parse(savedCfg);
            renderMemberList();
            renderTeamSettings();
        }

        // 연령대+성별로 그룹 자동 분류
        function getGroup(ageGroup, gender) {
            if (gender === 'female') return 'G';
            var num = parseInt(ageGroup);
            return num >= 40 ? 'OB' : 'YB';
        }

        // ============================================
        // 탭 전환
        // ============================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(function(el) {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(function(el) {
                el.classList.remove('active');
            });
            document.getElementById('tab-' + tabName).classList.add('active');
            var btns = document.querySelectorAll('.tab-btn');
            if (tabName === 'settings') btns[0].classList.add('active');
            else btns[1].classList.add('active');

            if (tabName === 'draw') {
                document.getElementById('drawTitle').textContent = currentConfig.title;
            }
        }

        // ============================================
        // 멤버 관리
        // ============================================
        function renderMemberList() {
            var tbody = document.getElementById('memberList');
            tbody.innerHTML = '';

            currentMembers.forEach(function(m, i) {
                var tr = document.createElement('tr');
                var group = getGroup(m.ageGroup, m.gender);
                tr.innerHTML =
                    '<td>' + (i + 1) + '</td>' +
                    '<td>' + m.name + '</td>' +
                    '<td>' + m.ageGroup + '</td>' +
                    '<td>' + (m.gender === 'male' ? '남' : '여') + '</td>' +
                    '<td>' + group + '</td>' +
                    '<td><button class="btn btn-danger btn-sm" onclick="deleteMember(' + i + ')">X</button></td>';
                tbody.appendChild(tr);
            });

            // 통계
            var ob = currentMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'OB'; }).length;
            var yb = currentMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'YB'; }).length;
            var g = currentMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'G'; }).length;
            document.getElementById('memberCount').textContent =
                '총 ' + currentMembers.length + '명 (OB: ' + ob + '명, YB: ' + yb + '명, G: ' + g + '명)';
        }

        function addMember() {
            var name = document.getElementById('inputName').value.trim();
            if (!name) { alert('이름을 입력하세요.'); return; }

            var ageGroup = document.getElementById('inputAgeGroup').value;
            var gender = document.getElementById('inputGender').value;

            currentMembers.push({ name: name, ageGroup: ageGroup, gender: gender });
            renderMemberList();

            document.getElementById('inputName').value = '';
            document.getElementById('inputName').focus();
        }

        function deleteMember(index) {
            currentMembers.splice(index, 1);
            renderMemberList();
        }

        // Enter키로 추가
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('inputName').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addMember();
            });
        });

        // ============================================
        // 팀 설정
        // ============================================
        function renderTeamSettings() {
            var cfg = currentConfig;
            var area = document.getElementById('teamSettingsArea');
            area.innerHTML = '';

            if (!cfg.teamLimits) cfg.teamLimits = [];

            cfg.teamNames.forEach(function(name, i) {
                var limit = cfg.teamLimits[i] || '';
                var div = document.createElement('div');
                div.className = 'team-row';
                div.innerHTML =
                    '<label>팀 ' + (i + 1) + '</label>' +
                    '<input type="text" value="' + name + '" onchange="updateTeamName(' + i + ', this.value)">' +
                    '<input type="color" value="' + (cfg.teamColors[i] || '#cccccc') + '" onchange="updateTeamColor(' + i + ', this.value)">' +
                    '<input type="number" min="1" max="99" value="' + limit + '" placeholder="인원" onchange="updateTeamLimit(' + i + ', this.value)">' +
                    '<span class="limit-label">명</span>';
                area.appendChild(div);
            });
        }

        function updateTeamName(index, value) {
            currentConfig.teamNames[index] = value;
        }

        function updateTeamColor(index, value) {
            currentConfig.teamColors[index] = value;
        }

        function updateTeamLimit(index, value) {
            if (!currentConfig.teamLimits) currentConfig.teamLimits = [];
            currentConfig.teamLimits[index] = value ? parseInt(value) : '';
        }

        function addTeam() {
            var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            var idx = currentConfig.teamNames.length;
            var letter = idx < alphabet.length ? alphabet[idx] : (idx + 1);
            currentConfig.teamNames.push(letter + '팀');
            currentConfig.teamColors.push('#cccccc');
            if (!currentConfig.teamLimits) currentConfig.teamLimits = [];
            renderTeamSettings();
        }

        function removeLastTeam() {
            if (currentConfig.teamNames.length <= 2) { alert('최소 2팀은 있어야 합니다.'); return; }
            currentConfig.teamNames.pop();
            currentConfig.teamColors.pop();
            if (currentConfig.teamLimits) currentConfig.teamLimits.pop();
            renderTeamSettings();
        }

        // ============================================
        // 팀 추첨
        // ============================================
        function startShuffle() {
            var resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            // 백그라운드에서 시트 불러오기 시작 (카운트다운 중 완료 기대)
            var sheetLoaded = false;
            callSheet('action=read', function(data) {
                if (data.members && data.members.length > 0) {
                    currentMembers = data.members;
                }
                if (data.teams && data.teams.length > 0) {
                    currentConfig.teamNames = data.teams.map(function(t) { return t.name; });
                    currentConfig.teamColors = data.teams.map(function(t) { return t.color; });
                    currentConfig.teamLimits = data.teams.map(function(t) { return t.limit; });
                }
                if (data.fixedGroups) {
                    localStorage.setItem(STORAGE_KEY_FIXED, JSON.stringify(data.fixedGroups));
                }
                localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(currentMembers));
                localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(currentConfig));
                sheetLoaded = true;
            });

            // 카운트다운 3, 2, 1
            var count = 3;
            var cdDiv = document.createElement('div');
            cdDiv.className = 'countdown';
            cdDiv.textContent = count;
            resultDiv.appendChild(cdDiv);

            var cdTimer = setInterval(function() {
                count--;
                if (count > 0) {
                    cdDiv.textContent = count;
                    cdDiv.style.animation = 'none';
                    cdDiv.offsetHeight; // reflow
                    cdDiv.style.animation = 'countPulse 0.6s ease';
                } else {
                    clearInterval(cdTimer);
                    resultDiv.innerHTML = '';
                    var shuffleDiv = document.createElement('div');
                    shuffleDiv.classList.add('shuffle');
                    shuffleDiv.textContent = '팀을 나누는 중입니다...';
                    resultDiv.appendChild(shuffleDiv);

                    // 시트 불러오기가 아직 안 끝났으면 기다림 (한 번만 실행 보장)
                    var divided = false;
                    var runDivide = function() {
                        if (divided) return;
                        divided = true;
                        divideTeams();
                    };
                    var waitForSheet = setInterval(function() {
                        if (sheetLoaded) {
                            clearInterval(waitForSheet);
                            setTimeout(runDivide, 300);
                        }
                    }, 100);
                    // 최대 5초 후에는 강제로 진행
                    setTimeout(function() {
                        clearInterval(waitForSheet);
                        runDivide();
                    }, 5000);
                }
            }, 700);
        }

        function divideTeams() {
            var members = currentMembers.map(function(m) { return Object.assign({}, m); });
            var cfg = currentConfig;
            var teamCount = cfg.teamNames.length;

            // 고정조 불러오기
            var fixedGroups = [];
            var savedFixed = localStorage.getItem(STORAGE_KEY_FIXED);
            if (savedFixed) fixedGroups = JSON.parse(savedFixed);

            // 고정조에 해당하는 멤버 이름 목록
            var fixedNames = {};
            fixedGroups.forEach(function(group, gi) {
                group.forEach(function(name) {
                    fixedNames[name] = gi;
                });
            });

            // 고정조 멤버와 일반 멤버 분리
            var fixedMembers = []; // [groupIndex] = [members]
            fixedGroups.forEach(function() { fixedMembers.push([]); });
            var freeMembers = [];

            members.forEach(function(m) {
                if (fixedNames[m.name] !== undefined) {
                    fixedMembers[fixedNames[m.name]].push(m);
                } else {
                    freeMembers.push(m);
                }
            });

            // 일반 멤버를 그룹별 분리
            var obMembers = freeMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'OB'; });
            var ybMembers = freeMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'YB'; });
            var gMembers = freeMembers.filter(function(m) { return getGroup(m.ageGroup, m.gender) === 'G'; });

            shuffle(shuffle(obMembers));
            shuffle(shuffle(ybMembers));
            shuffle(shuffle(gMembers));

            // 팀 초기화
            var teams = [];
            for (var t = 0; t < teamCount; t++) teams.push([]);

            // 인원 제한 배열
            var limits = cfg.teamLimits || [];

            // 0) 고정조를 랜덤 팀에 배정 (같은 조는 같은 팀)
            var teamIndices = [];
            for (var t = 0; t < teamCount; t++) teamIndices.push(t);
            shuffle(teamIndices);
            fixedMembers.forEach(function(group, gi) {
                if (group.length === 0) return;
                var targetTeam = teamIndices[gi % teamIndices.length];
                group.forEach(function(m) {
                    teams[targetTeam].push(m);
                });
            });

            // 1) 여성(G) 균등 배분
            distributeToTeams(gMembers, teams, limits);

            // 2) OB(연장자) 균등 배분
            distributeToTeams(obMembers, teams, limits);

            // 3) YB(주니어) 균등 배분
            distributeToTeams(ybMembers, teams, limits);

            // 3) 각 팀 내 정렬: 남성(연령대 높은순) → 여성(연령대 높은순)
            var ageOrder = { '60대': 1, '50대': 2, '40대': 3, '30대': 4, '20대': 5 };
            for (var t = 0; t < teamCount; t++) {
                teams[t].sort(function(a, b) {
                    var aFemale = a.gender === 'female' ? 1 : 0;
                    var bFemale = b.gender === 'female' ? 1 : 0;
                    if (aFemale !== bFemale) return aFemale - bFemale;
                    return (ageOrder[a.ageGroup] || 9) - (ageOrder[b.ageGroup] || 9);
                });
            }

            // 결과 출력
            var resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            var teamDivs = [];
            for (var k = 0; k < teamCount; k++) {
                var teamDiv = document.createElement('div');
                teamDiv.classList.add('team');
                teamDiv.style.backgroundColor = cfg.teamColors[k] || '#ccc';
                teamDiv.style.animationDelay = (k * 0.15) + 's';
                var teamTitle = document.createElement('h3');
                teamTitle.textContent = cfg.teamNames[k];
                teamDiv.appendChild(teamTitle);
                resultDiv.appendChild(teamDiv);
                teamDivs.push(teamDiv);
            }

            var maxLength = 0;
            teams.forEach(function(team) { if (team.length > maxLength) maxLength = team.length; });

            for (var i = 0; i < maxLength; i++) {
                (function(i) {
                    setTimeout(function() {
                        for (var k = 0; k < teamCount; k++) {
                            if (i < teams[k].length) {
                                var member = teams[k][i];
                                var memberInfo = document.createElement('p');
                                memberInfo.textContent = member.name;
                                teamDivs[k].appendChild(memberInfo);
                                setTimeout((function(el) {
                                    return function() { el.classList.add('show'); };
                                })(memberInfo), 100);
                            }
                        }
                        // 마지막 줄이면 완료 메시지 (팀 카드 아래)
                        if (i === maxLength - 1) {
                            setTimeout(function() {
                                var doneWrap = document.createElement('div');
                                doneWrap.style.width = '100%';
                                var doneDiv = document.createElement('div');
                                doneDiv.className = 'done-msg';
                                doneDiv.textContent = '팀 배정 완료!';
                                doneWrap.appendChild(doneDiv);
                                resultDiv.appendChild(doneWrap);
                            }, 500);
                        }
                    }, i * 400);
                })(i);
            }
        }

        // 가장 적은 팀에 우선 배정 (동점이면 랜덤, 인원 제한 적용)
        function distributeToTeams(memberList, teams, limits) {
            var teamCount = teams.length;
            memberList.forEach(function(member) {
                var minSize = Infinity;
                var candidates = [];
                for (var t = 0; t < teamCount; t++) {
                    var limit = (limits && limits[t]) ? limits[t] : Infinity;
                    if (teams[t].length >= limit) continue;
                    if (teams[t].length < minSize) {
                        minSize = teams[t].length;
                        candidates = [t];
                    } else if (teams[t].length === minSize) {
                        candidates.push(t);
                    }
                }

                var targetIdx;
                if (candidates.length === 0) {
                    // 모든 팀이 제한 꽉 찬 경우 가장 적은 팀에
                    targetIdx = 0;
                    for (var t = 1; t < teamCount; t++) {
                        if (teams[t].length < teams[targetIdx].length) targetIdx = t;
                    }
                } else {
                    // 동점팀들 중 랜덤 선택
                    targetIdx = candidates[Math.floor(Math.random() * candidates.length)];
                }
                teams[targetIdx].push(member);
            });
        }

        // Fisher-Yates shuffle
        function shuffle(array) {
            var currentIndex = array.length, temporaryValue, randomIndex;
            while (0 !== currentIndex) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;
                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;
            }
            return array;
        }

        // ============================================
        // 초기화
        // ============================================
        initData();
        renderMemberList();
        renderTeamSettings();

        // 페이지 열릴 때 자동으로 시트에서 불러오기
        loadFromSheet();
    </script>
